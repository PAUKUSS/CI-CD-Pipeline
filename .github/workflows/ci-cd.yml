name: CI/CD for C# Script

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Run tests
      run: |
        cd tests
        dotnet test --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/TestResults/*.trx

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Debug project structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Project files:"
        find . -name "*.csproj"
        echo "Solution files:"
        find . -name "*.sln"
    
    - name: Build project
      run: dotnet build src --configuration Release
    
    - name: Check vulnerable packages
      run: |
        # Ищем основной проект
        PROJECT_FILE=$(find src -name "*.csproj" | head -1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: No .csproj file found in src directory!"
          exit 1
        fi
        echo "Checking vulnerabilities in $PROJECT_FILE"
        dotnet list "$PROJECT_FILE" package --vulnerable
    
    - name: List build artifacts
      run: ls -la src/bin/Release/net8.0/
    
    - name: VirusTotal scan
      run: |
        echo "Starting VirusTotal scan..."
        # Автоматически определяем первый .dll файл
        DLL_FILE=$(find src/bin/Release/net8.0 -name "*.dll" | head -1)
        if [ -z "$DLL_FILE" ]; then
          echo "Error: No .dll files found in src/bin/Release/net8.0/"
          ls -la src/bin/Release/net8.0/
          exit 1
        fi
        
        echo "Scanning $DLL_FILE with VirusTotal..."
        SCAN_RESULT=$(curl -s -X POST \
          -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
          -F "file=@$DLL_FILE" \
          https://www.virustotal.com/api/v3/files)
        
        echo "Scan results:"
        echo "$SCAN_RESULT" | jq .

  build:
       needs: security
       runs-on: ubuntu-latest
        
       permissions:
          contents: write
          pull-requests: write
        
       steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0  
            
        - name: Setup .NET
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '8.0.x'
        
        - name: Build
          run: dotnet build src --configuration Release
        
        - name: Update changelog
          run: |
            echo "## [v$(cat version)] - $(date +'%Y-%m-%d')" > temp-changelog.md
            echo "- Build ${GITHUB_RUN_NUMBER}" >> temp-changelog.md
            echo "- Updated dependencies" >> temp-changelog.md
            cat changelog.md >> temp-changelog.md
            mv temp-changelog.md changelog.md
        
        - name: Commit and push changes
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            echo "Working on branch: $CURRENT_BRANCH"
            
            cp changelog.md changelog_temp.md
            
            git fetch origin $CURRENT_BRANCH
            
            git reset --hard origin/$CURRENT_BRANCH
            
            mv changelog_temp.md changelog.md
            
            git add changelog.md version
            
            if ! git diff-index --quiet HEAD --; then
              git commit -m "CI: Update changelog for v$(cat version) [skip ci]"
              
              git push "https://$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:$CURRENT_BRANCH
              
              echo "Changes pushed successfully to $CURRENT_BRANCH"
            else
              echo "No changes to commit"
            fi
            
            rm -f changelog_temp.md

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ C# Script v$(cat version) passed all checks!
          📝 Changelog:
          $(head -5 changelog.md)
        file: changelog.md
