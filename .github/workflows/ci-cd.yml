name: CI/CD for C# Script

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Run tests
      run: |
        cd tests
        dotnet test --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/TestResults/*.trx

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: VirusTotal scan
      uses: actions/virustotal-scan@v1
      with:
        api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
        path: src/bin/Release/net8.0/
    
    - name: Dependency check
      run: dotnet list package --vulnerable

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: dotnet build src --configuration Release
    
    - name: Update changelog
      run: |
        echo "## [v$(cat version)] - $(date +'%Y-%m-%d')" > temp-changelog.md
        echo "- Initial release" >> temp-changelog.md
        cat changelog.md >> temp-changelog.md
        mv temp-changelog.md changelog.md
    
    - name: Commit changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add changelog.md
        git commit -m "CI: Update changelog for v$(cat version)"
        git push

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ C# Script v$(cat version) passed all checks!
          📝 Changelog:
          $(head -5 changelog.md)
        file: changelog.md
