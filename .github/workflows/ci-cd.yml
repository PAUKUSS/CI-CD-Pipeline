name: CI/CD for C# Script

on: [push, pull_request]

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Initialize version file
      run: |
        if [ ! -f version ]; then
          echo "1.0.0" > version
          git add version
          git commit -m "Initialize version file"
        fi
        cat version
    
    - name: Bump version
      id: bump_version
      run: |
        CURRENT_VERSION=$(cat version)
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
        echo "$NEW_VERSION" > version
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Version bumped from $CURRENT_VERSION to $NEW_VERSION"

  test:
    needs: versioning
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Run tests
      run: |
        cd tests
        dotnet test --logger "trx;LogFileName=test-results.trx" --no-build
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: tests/TestResults/*.trx

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Debug project structure
      run: |
        echo "Current directory: $(pwd)"
        echo "Project files:"
        find . -name "*.csproj"
        echo "Solution files:"
        find . -name "*.sln"
    
    - name: Build project
      run: dotnet build src --configuration Release
    
    - name: Check vulnerable packages
      run: |
        PROJECT_FILE=$(find src -name "*.csproj" | head -1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: No .csproj file found in src directory!"
          exit 1
        fi
        echo "Checking vulnerabilities in $PROJECT_FILE"
        dotnet list "$PROJECT_FILE" package --vulnerable
    
    - name: VirusTotal scan
      run: |
        DLL_FILE=$(find src/bin/Release/net8.0 -name "*.dll" | head -1)
        if [ -z "$DLL_FILE" ]; then
          echo "Error: No .dll files found!"
          ls -la src/bin/Release/net8.0/
          exit 1
        fi
        
        echo "Scanning $DLL_FILE with VirusTotal..."
        curl -s -X POST \
          -H "x-apikey: ${{ secrets.VIRUSTOTAL_API_KEY }}" \
          -F "file=@$DLL_FILE" \
          https://www.virustotal.com/api/v3/files | jq .

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Build
      run: dotnet build src --configuration Release
    
    - name: Update changelog
      run: |
        echo "# Version ${{ needs.versioning.outputs.new_version }} - $(date +'%Y-%m-%d')" > changelog.tmp
        echo "" >> changelog.tmp
        echo "## Changes" >> changelog.tmp
        git log --pretty=format:"- %s" -n 5 >> changelog.tmp
        [ -f changelog.md ] && cat changelog.md >> changelog.tmp
        mv changelog.tmp changelog.md
        
        # Create txt version
        grep -v '^#' changelog.md | sed 's/^## //' > changelog.txt

    - name: Commit and push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add version changelog.*
        if ! git diff-index --quiet HEAD --; then
          git commit -m "Release ${{ needs.versioning.outputs.new_version }} [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push "https://$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:${{ github.ref_name }}
        fi

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify files
      run: |
        echo "Version: $(cat version)"
        echo "Changelog content:"
        cat changelog.txt
    
    - name: Send Telegram notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ✅ Deployment Successful!
          🏷 Version: ${{ needs.versioning.outputs.new_version }}
          🔗 Build: ${{ github.run_number }}
          📅 Date: $(date +'%Y-%m-%d %H:%M UTC')
        file: changelog.txt
